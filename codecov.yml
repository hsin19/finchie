# Each job of .github/workflows/check.yml uploads its app's coverage and test results under a flag
# named after the app (layout in .github/workflows/README.md); the components below slice the merged
# coverage by path. Validate a change with `curl --data-binary @codecov.yml https://codecov.io/validate`.

coverage:
  status:
    # Neither blocks anything: auto-merge waits on check.yml's jobs, never on Codecov. The project
    # status guards the trend, red on a drop of more than 1%; a patch's percentage swings on a handful
    # of lines, so that one only reports.
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        informational: true

# Flags stay on the uploads: test results filter only by flag, and only a flag can carry an app's
# coverage forward should check.yml ever skip unchanged apps. Components cut finer than an upload.
component_management:
  individual_components:
    - component_id: backend
      paths: [apps/backend/]
    - component_id: parser
      paths: [apps/parser/]
    # The core of the parser, also counted in `parser`: every bank's statements are read here.
    - component_id: parser-banks
      name: parser (bank parsers)
      paths: [apps/parser/src/finchie_parser/parsers/]
    - component_id: cli
      paths: [apps/cli/]
    # The web app in two: its logic is unit-tested, while no test renders a component yet. Together
    # they would hide a drop in the one behind the other.
    - component_id: web-logic
      name: web (logic)
      paths: ['^apps/web/.*\.ts$']
    - component_id: web-ui
      name: web (components)
      paths: ['^apps/web/.*\.svelte$']
    - component_id: mailbox
      paths: [apps/mailbox/]

# The Go profile names files by import path, and the Python reports relative to their app.
fixes:
  - "github.com/hsin19/finchie/::"
  - "src/finchie_parser/::apps/parser/src/finchie_parser/"
  - "src/finchie_cli/::apps/cli/src/finchie_cli/"

ignore:
  # Generated (AGENTS.md); the parser's and the web app's generated code is outside what their tests measure.
  - apps/backend/internal/gen
  - apps/backend/internal/db/dbq
  - apps/backend/internal/api/openapi.gen.go
  # Test helpers
  - apps/backend/internal/testdb
  - apps/backend/internal/parsertest

comment:
  layout: "condensed_header, components, files"
  # A PR that moves no covered line, such as a docs change, gets no comment.
  require_changes: true
