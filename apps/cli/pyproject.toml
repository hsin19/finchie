[project]
name = "finchie-cli"
version = "0.1.0"
description = "Finchie's API as commands, for agents and scripts: built at run time from the backend's contract"
readme = "README.md"
requires-python = ">=3.13"
# None: it runs through uvx straight from the repository, and the standard library is enough.
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
    # Tests read the backend's openapi.yaml, to build every command of the real contract.
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
finchie = "finchie_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finchie_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "N", "RUF", "PT", "DTZ"]
# The ledger's text is Chinese, full-width punctuation included.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src/finchie_cli", "tests"]
mypy_path = ["src", "tests"]
