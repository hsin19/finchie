version: '3'

vars:
  IMAGE: ghcr.io/hsin19/finchie-parser

tasks:
  install:
    desc: Install dependencies into .venv
    cmds:
      - uv sync

  lint:
    desc: Lint, check formatting, and type-check (mypy, strict)
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy

  fmt:
    desc: Fix lint and format
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Unit tests (synthetic fixtures only)
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  generate:
    desc: Regenerate the Gmail filter from the parsers' sender domains (commit the output, ADR 0014)
    cmds:
      - uv run python -m finchie_parser.mail_filter ../backend/internal/mailfilter/gmail-filters.xml

  test-real:
    desc: Parse every statement in .local/statements and assert it reconciles (ADR 0006); reads ../../.local/parser.env
    env:
      FINCHIE_REAL_STATEMENTS_DIR: '{{.FINCHIE_REAL_STATEMENTS_DIR | default "../../.local/statements"}}'
    cmds:
      - uv run pytest tests/test_real_statements.py -s {{.CLI_ARGS}}

  check:
    desc: Everything CI runs for the parser
    cmds:
      - task: lint
      - task: test

  run:
    desc: Start the gRPC server on :50051 (reads ../../.local/parser.env)
    dotenv: ['../../.local/parser.env']
    cmds:
      - uv run python -m finchie_parser

  image:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}}:dev .
