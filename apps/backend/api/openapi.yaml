openapi: 3.0.3
info:
  title: Finchie API
  version: 2.0.0
  description: |
    Upload statements and read what was parsed from them. Amounts are decimal strings
    and dates on statements are calendar dates (ADR 0004).

paths:
  /api/documents:
    post:
      operationId: uploadDocument
      summary: Upload a statement e-mail (.eml) and queue it for parsing
      description: |
        Statements are taken as e-mails only, as the bank sent them or forwarded (ADR 0014); anything
        else, a bare PDF included, is refused before it is stored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored and queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "200":
          description: The same bytes were uploaded before; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
    get:
      operationId: listDocuments
      summary: Uploaded documents, newest first, a page at a time
      description: |
        Filters combine with AND. A page shorter than `limit` is the last; the next one starts
        `before` the last document of this one.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: The last document of the page before; the list continues after it
          schema: { type: integer, format: int64 }
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/DocumentStatus" }
        - name: q
          in: query
          description: Case-insensitive substring of the filename
          schema: { type: string }
        - name: id
          in: query
          description: Only these documents, wherever they fall in the list (for refreshing ones already shown)
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer, format: int64 }
      responses:
        "200":
          description: One page of documents, and how many match in each state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPage" }

  /api/documents/{id}:
    get:
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDocument
      summary: Delete a document that holds nothing of the ledger, its original included
      description: |
        Only a document that failed, was skipped, or is a duplicate (`deletable`). Documents that are
        duplicates of this one are parsed again, so that one of them holds the statement.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/reparse:
    post:
      operationId: reparseDocument
      summary: Parse the stored original again, e.g. after a parser fix
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "404":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/content:
    get:
      operationId: getDocumentContent
      summary: The original file exactly as uploaded
      description: |
        PDFs open in the browser (inline); everything else downloads (attachment) as
        application/octet-stream. The file is served from the web app's own origin, so nothing a
        browser could run as a page is ever shown in place.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The stored bytes
          headers:
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/preview:
    get:
      operationId: getDocumentPreview
      summary: The document opened for reading
      description: |
        The bank's e-mail, unwrapped from a forward (ADR 0014): its headers and attachments. The parser
        opens the stored original on every request and PDFs come back decrypted; nothing decrypted is stored (ADR 0012),
        so the PDF, body, and file responses carry `Cache-Control: no-store`.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: What the document holds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentPreview" }
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/preview/pdf:
    get:
      operationId: getDocumentPreviewPdf
      summary: The document's statement PDF, decrypted
      description: |
        The primary file of the preview: the PDF whose name a bank parser knows as its statement, else
        the first PDF. It opens in the browser, whose viewer can save the decrypted copy. 404 when the
        document holds no PDF.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The PDF
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/preview/body:
    get:
      operationId: getDocumentPreviewBody
      summary: The e-mail's body as a page of its own, for an iframe
      description: |
        The Content-Security-Policy sandboxes the page: no scripts, forms, or plugins, an origin of its
        own, and nothing loaded from elsewhere but https images. Links open in a new tab, without a
        referrer. A plain-text body comes wrapped in a page. 404 for a bare PDF.
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The body
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Content-Security-Policy:
              schema: { type: string }
            Referrer-Policy:
              schema: { type: string, enum: [no-referrer] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            # The charset in the header wins over a <meta charset> left in the e-mail's HTML, which
            # names the encoding the bank sent, not this UTF-8 copy.
            text/html; charset=utf-8:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/documents/{id}/preview/files/{index}:
    get:
      operationId: getDocumentPreviewFile
      summary: One file from the preview, a PDF decrypted
      description: |
        PDFs open in the browser (inline), so its viewer can save the decrypted copy; anything else
        downloads (attachment) as application/octet-stream.
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The file
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /api/accounts:
    get:
      operationId: listAccounts
      summary: Every account, with its newest balance in each unit and where its balances do not join up
      description: |
        Accounts are discovered from what their sources report (ADR 0013). A deposit account's
        balances are checked for continuity: two consecutive ones join when the lines dated between
        them account for the difference. A card bill's cannot be checked yet, nor a deposit account's
        whose balance moved in a unit no statement has listed a line of, as when its statements print
        only its balance, nor an exchange's, which reports what it holds and nothing else (ADR 0018).
      responses:
        "200":
          description: Accounts by institution
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: createAccount
      summary: An account the owner keeps by hand
      description: |
        Of any kind but a card's (ADR 0019): its institution `owner`, and the name it is opened with its
        own (`label`), as a bank's account has the bank's; no two accounts go by one name the owner gave.
        It holds what `PUT /api/accounts/{id}/holdings` says.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCreated" }
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/accounts/{id}:
    get:
      operationId: getAccount
      summary: One account with every balance its sources reported
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDetail" }
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateAccount
      summary: The owner's details of an account, its own name and its full number
      description: |
        Both optional (ADR 0016): a field left out stays as it is, an empty string clears it. A full
        number must fit the masked number the bank prints, digit for digit; links are worked out
        again, since it fits counterparties too. No two accounts go by one name the owner gave (`409`);
        cleared, an account goes by its own again.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountUpdate" }
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/accounts/{id}/holdings:
    put:
      operationId: updateHoldings
      summary: What an account the owner keeps holds today, and what will lapse
      description: |
        Only for an account the owner opened (ADR 0019): today's snapshot of the whole account, as an
        exchange's is (ADR 0018). A later one the same day replaces it, and a unit it held before and
        no longer lists is at 0. Each unit is of the kind the account holds (money, securities by name,
        points, ADR 0020); what will lapse replaces all the account had.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldingsUpdate" }
      responses:
        "204":
          description: Updated
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

  /api/units:
    get:
      operationId: listUnits
      summary: The units amounts are counted in
      description: Every unit a source has reported or the owner has named (ADR 0020), optionally of one kind.
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/UnitKind" }
      responses:
        "200":
          description: Units by kind and symbol
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Unit" }

  /api/units/{id}/price:
    put:
      operationId: setUnitPrice
      summary: What one unit is worth, by the owner's word
      description: |
        A price of the owner's, as of now (ADR 0020). Like any price it counts while it is the unit's
        newest, whatever the source: a rate or a close of a later day takes over from it. A later one the
        same day replaces it.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnitPriceUpdate" }
      responses:
        "204":
          description: Set
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearUnitPrice
      summary: Withdraw every price the owner gave a unit
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cleared
        "404":
          $ref: "#/components/responses/Problem"

  /api/accounts/{id}/fills:
    post:
      operationId: fillGap
      summary: Make up for one of an account's gaps with what it lacks
      description: |
        For a gap in `gaps`, named by its unit and its two balances' days, once the reports that would
        show what moved are lost. What it lacks becomes a line of the account with no statement (kind
        `fill`), on the last day no report covers, for the whole period: the two balances join up, and
        net worth counts it from that day. No search, total, or transfer sees it: it is what moved over
        the period, net. It counts while those two balances are consecutive and lack exactly that, so a
        report found later, or a balance read differently, sets it aside; filling the same two balances
        again brings it back. 409 when there is no such gap to fill.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GapFillCreate" }
      responses:
        "201":
          description: Filled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GapFill" }
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"

  /api/accounts/{id}/fills/{fillId}:
    patch:
      operationId: updateGapFill
      summary: What the owner writes about a fill; empty clears it
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: fillId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GapFillUpdate" }
      responses:
        "204":
          description: Updated
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGapFill
      summary: Take a fill back; the gap shows again
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: fillId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /api/accounts/{id}/lines:
    get:
      operationId: listAccountLines
      summary: An account's lines, newest first
      description: |
        Amounts as the source reports them: on a deposit account money in is positive, on a card bill
        a purchase is.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Limit"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Lines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountLine" }
        "404":
          $ref: "#/components/responses/Problem"

  /api/net-worth:
    get:
      operationId: getNetWorth
      summary: What the owner has less what they owe, in NT$, on a day
      description: |
        Every account's worth on the day added up, assets and liabilities (ADR 0022), overall and by kind;
        accounts without a worth are counted, not guessed. Each account's newest balance on or before the
        day, at each unit's newest price at the end of that day in Taipei (ADR 0023). `completeAsOf` is the
        newest day every account had reported by; after it the figure is an estimate, and `behind` names
        the accounts that have not reported since.
      parameters:
        - name: "on"
          in: query
          description: The day, Taipei's today when left out
          schema: { type: string, format: date }
      responses:
        "200":
          description: The net worth
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetWorth" }

  /api/net-worth/history:
    get:
      operationId: getNetWorthHistory
      summary: Net worth over time, by day or by month end
      description: |
        As /api/net-worth for each day from `from` to `to` (Taipei's today when left out), every day or
        the last day of each month and `to` itself; at most 1000 points.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: step
          in: query
          schema: { $ref: "#/components/schemas/HistoryStep" }
      responses:
        "200":
          description: The series, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NetWorthPoint" }
        "400": { $ref: "#/components/responses/Problem" }

  /api/settings:
    get:
      operationId: getSettings
      summary: The deployment's settings the web app shows or obeys
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /api/mail-filters.xml:
    get:
      operationId: getMailFilters
      summary: The Gmail filter that forwards statement e-mails to the mailbox
      description: |
        Generated from the parsers' sender domains (ADR 0014), in the format Gmail imports (Settings,
        Filters, Import filters), forwarding to BACKEND_MAILBOX_ADDRESS. 404 while that is not set.
      responses:
        "200":
          description: The filter
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"

  /api/statements:
    get:
      operationId: listStatements
      summary: Parsed statements, newest closing date first
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Statements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Statement" }

  /api/statements/{id}:
    get:
      operationId: getStatement
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "404":
          $ref: "#/components/responses/Problem"

  /api/transactions/{id}:
    get:
      operationId: getTransaction
      summary: A transaction with its parent and children, whichever statements they are on
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The transaction and the lines linked to it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionFamily" }
        "404":
          $ref: "#/components/responses/Problem"

  /api/statements/{id}/transactions:
    get:
      operationId: listStatementTransactions
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Transactions in statement order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
        "404":
          $ref: "#/components/responses/Problem"

  /api/transactions:
    get:
      operationId: searchTransactions
      summary: Transactions across every statement, newest first, with totals for the whole match
      description: |
        Filters combine with AND. `total` and `sum` cover every matching row, not just this page.
        `byKind`, `byCard`, and `byAccount` are facets: each ignores its own filter (byKind ignores
        `kind`; byCard and byAccount, the account picker's, ignore `institution`, `card`, and
        `account`), so a picker can show the options it would switch to. Card and deposit lines come
        together unless `accountKind` picks one (ADR 0013); `sum` adds amounts as printed and only means
        something within one kind, `flows` add them as the owner sees them.

        While `kind` includes purchases (or is not given), a line with a parent (a fee or refund
        linked to its purchase) is not a row of its own but one of the parent's `children`, and rows,
        `sum`, `byCard`, and the amount sorts count it there: amounts are net of children. `byKind`
        counts the lines as printed either way.
      parameters:
        - name: from
          in: query
          description: First transaction date, inclusive
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Last transaction date, inclusive
          schema: { type: string, format: date }
        - name: closingFrom
          in: query
          description: First closing date of the transaction's statement, inclusive
          schema: { type: string, format: date }
        - name: closingTo
          in: query
          description: Last closing date of the transaction's statement, inclusive
          schema: { type: string, format: date }
        - name: kind
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/TransactionKind" }
        - name: institution
          in: query
          schema: { type: string }
        - name: card
          in: query
          description: Last four digits of the card
          schema: { type: string }
        - name: overseas
          in: query
          description: Only rows charged in a foreign currency or in another country
          schema: { type: boolean }
        - name: accountKind
          in: query
          description: Only card lines, or only deposit lines
          schema: { $ref: "#/components/schemas/AccountKind" }
        - name: account
          in: query
          description: One deposit account
          schema: { type: integer, format: int64 }
        - name: hideTransfers
          in: query
          description: Leave out transfers between the owner's lines and card payments (ADR 0016)
          schema: { type: boolean }
        - name: q
          in: query
          description: Case-insensitive substring of the description or the memo
          schema: { type: string }
        - name: sort
          in: query
          description: Row order; largest and smallest compare amounts by size, ignoring the sign
          schema: { $ref: "#/components/schemas/TransactionSort" }
        - name: limit
          in: query
          description: Page size; 0 returns only the totals
          schema: { type: integer, minimum: 0, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of matches and the totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSearch" }

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Decimal:
      type: string
      description: Decimal number as a string, e.g. "-6552.97"
      example: "1234.50"

    DocumentStatus:
      type: string
      enum: [pending, parsed, needs_review, duplicate, failed, skipped]
      description: |
        pending: queued or being parsed. parsed: reconciled. needs_review: parsed but the
        transactions don't add up to the statement. duplicate: the same statement came from
        another document (`duplicateOf`). failed: it could not be parsed (`failure`, `error`).
        skipped: no parser handles it, so there is nothing to fix or retry.

    DocumentFailure:
      type: string
      enum: [unsupported, locked, unreadable, layout, unavailable, invalid_response, other]
      description: |
        Why a document could not be parsed: what has to change first. unsupported: no parser
        handles it (the document is skipped). locked: its PDF needs a password the parser lacks.
        unreadable: it is no e-mail, or cannot be read as one. layout: its layout is not the one
        the parser knows. unavailable: the parser could not be reached in time; the backend tries
        again by itself. invalid_response: the parser broke its contract. other: anything else.

    DocumentPage:
      type: object
      required: [items, byState]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Document" }
        byState:
          type: array
          description: "Every document matching `q`, by state: a facet that ignores `state` and `before`. States with none are left out"
          items: { $ref: "#/components/schemas/StateCount" }

    StateCount:
      type: object
      required: [state, count]
      properties:
        state: { $ref: "#/components/schemas/DocumentStatus" }
        count: { type: integer }

    Document:
      type: object
      required: [id, filename, contentType, sizeBytes, sha256, receivedAt, status, warnings, lineCount, accountCount, deletable]
      properties:
        id: { type: integer, format: int64 }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string, description: Hex }
        receivedAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/DocumentStatus" }
        failure:
          allOf: [{ $ref: "#/components/schemas/DocumentFailure" }]
          description: Why it failed or was skipped; absent otherwise
        error: { type: string, description: "The details of a failure, for reading" }
        duplicateOf:
          type: integer
          format: int64
          description: The document holding the statement this one repeats, when a duplicate
        parser: { type: string }
        parserVersion: { type: string }
        warnings:
          type: array
          items: { type: string }
        parsedAt: { type: string, format: date-time }
        statementKind:
          allOf: [{ $ref: "#/components/schemas/AccountKind" }]
          description: The kind of statement it produced, if any; card bills only are listed by /api/statements
        lineCount: { type: integer, description: "Lines its statement holds, 0 without one" }
        accountCount: { type: integer, description: "Accounts its statement reported, 0 without one" }
        deletable:
          type: boolean
          description: "Whether DELETE takes it: it failed, was skipped, or is a duplicate, and so holds nothing of the ledger"

    DocumentPreview:
      type: object
      required: [files]
      properties:
        email: { $ref: "#/components/schemas/EmailPreview" }
        files:
          type: array
          description: The e-mail's attachments in order, or the bare PDF
          items: { $ref: "#/components/schemas/PreviewFile" }

    EmailPreview:
      type: object
      required: [sender, recipient, subject, hasBody]
      properties:
        sender: { type: string }
        recipient: { type: string }
        subject: { type: string }
        date: { type: string, format: date-time }
        hasBody: { type: boolean, description: Whether /preview/body has anything to show }

    PreviewFile:
      type: object
      required: [index, filename, contentType, sizeBytes, locked, primary]
      properties:
        index: { type: integer }
        filename: { type: string }
        contentType: { type: string, description: '"application/pdf" when the bytes are a PDF, else as the e-mail declares it' }
        sizeBytes: { type: integer }
        locked: { type: boolean, description: "A PDF none of the parser's passwords opens, served as received" }
        primary: { type: boolean, description: The one file /preview/pdf serves }

    Statement:
      type: object
      required: [id, documentId, institution, closingDate, dueDate, currency, totalDue, balanced, checks, transactionCount]
      properties:
        id: { type: integer, format: int64 }
        documentId: { type: integer, format: int64 }
        institution: { type: string, example: taishin }
        closingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string, example: TWD }
        totalDue: { $ref: "#/components/schemas/Decimal" }
        balanced: { type: boolean, description: "Every check balances" }
        checks:
          type: array
          description: Every figure the bill prints that its lines are checked against, in its order (ADR 0021)
          items: { $ref: "#/components/schemas/Check" }
        transactionCount: { type: integer }
        paidOn: { type: string, format: date, description: "When a deposit account or a later bill showed it paid (ADR 0016); absent while that is not known" }

    AccountKind:
      type: string
      enum: [credit_card, deposit, securities, exchange, points, loan]

    AccountSide:
      type: string
      enum: [asset, liability]
      description: "A liability's balances are what is owed, as printed; its worth is negative (ADR 0022)"

    AccountContinuity:
      type: string
      enum: [checked, unknown]
      description: Whether its balances can be checked against its lines (card bills cannot yet, nor a deposit account whose balance moved in a unit no statement has listed a line of)

    Account:
      type: object
      required: [id, institution, kind, side, number, balances, continuity, gaps, expiries]
      properties:
        id: { type: integer, format: int64 }
        institution: { type: string, example: esun }
        kind: { $ref: "#/components/schemas/AccountKind" }
        side: { $ref: "#/components/schemas/AccountSide" }
        number: { type: string, description: "As printed, usually masked; empty for a bank's card or points account", example: "1234567***890" }
        label: { type: string, nullable: true, description: The source's name for it, example: 臺幣活存 }
        name: { type: string, nullable: true, description: The owner's name for it }
        fullNumber: { type: string, description: "Its full number, where the owner gave one (ADR 0016)" }
        balances:
          type: array
          description: The newest balance in each unit
          items: { $ref: "#/components/schemas/Balance" }
        continuity: { $ref: "#/components/schemas/AccountContinuity" }
        worth:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: >-
            In NT$: its newest balances' worth added up; else, when one of them has none, its valuation
            on the day of its newest balance (ADR 0018); else absent
        worthFrom: { $ref: "#/components/schemas/WorthFrom" }
        valuation: { $ref: "#/components/schemas/Valuation" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/BalanceGap" }
        expiries:
          type: array
          description: "What will lapse of its units, by their newest report, soonest first; none of 0 or gone by (ADR 0019)"
          items: { $ref: "#/components/schemas/Expiry" }

    AccountDetail:
      allOf:
        - $ref: "#/components/schemas/Account"
        - type: object
          required: [history, fills]
          properties:
            history:
              type: array
              description: Every balance its sources reported, statements and snapshots, newest first
              items: { $ref: "#/components/schemas/Balance" }
            fills:
              type: array
              description: "The owner's fills of its gaps that count, newest first: the gaps they fill are not in `gaps`"
              items: { $ref: "#/components/schemas/GapFill" }
            positions:
              type: array
              description: "A securities account's: every security it holds or has traded, by name (ADR 0017)"
              items: { $ref: "#/components/schemas/Position" }

    Position:
      type: object
      description: >-
        A security in a securities account. Its cost is the average cost of the shares held: a buy adds its
        amount and fee, a sale takes off the average cost of the shares it sold. Known only from a day the
        account held none of it with no gap since; never estimated (ADR 0017).
      required: [unit, shares]
      properties:
        unit: { type: string, description: The security's name, as statements print it }
        code: { type: string }
        shares: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: The newest holding; 0 once sold out }
        worth: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: The shares at the newest close }
        cost: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: What the shares held cost; absent when not known }
        gain: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: Worth less cost, where both are known }
        realized:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "What its sales gained, their amounts less fee and tax against their cost; absent when a sale's cost is not known"
        since: { type: string, format: date, description: The day it was last held at none, from which cost is known }

    Expiry:
      type: object
      description: "Points a source says will lapse by a date (ADR 0019): one date's, one month's, or several months' together"
      required: [unit, amount, by]
      properties:
        unit: { type: string, example: 小樹點(信用卡) }
        amount: { $ref: "#/components/schemas/Decimal" }
        by: { type: string, format: date }

    WorthFrom:
      type: string
      enum: [holdings, valuation]
      description: "What the account's worth came from (ADR 0018): its holdings at Finchie's rates and closes, or its source's valuation"

    Valuation:
      type: object
      description: "What a source says the whole account is worth (ADR 0018): an exchange, by its own prices"
      required: [unit, asOf, amount]
      properties:
        unit: { type: string, example: USDT }
        asOf: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Decimal" }
        worth:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "In NT$, at its unit's newest price (ADR 0020); absent for a unit without one"

    Balance:
      type: object
      required: [unit, asOf, amount]
      properties:
        unit: { type: string, description: "Its unit's symbol: ISO 4217 or a coin's ticker, a security's name, a points program's", example: TWD }
        unitId: { type: integer, format: int64, description: "Its unit (ADR 0020), for giving it a price; on an account's newest balances" }
        asOf: { type: string, format: date, description: The end of the day it was held }
        amount: { $ref: "#/components/schemas/Decimal" }
        statementId: { type: integer, format: int64, description: "The statement that reported it; absent for a snapshot, such as an exchange's (ADR 0018)" }
        worth:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "In NT$, at its unit's newest price (ADR 0020); absent for a unit without one in NT$"
        code: { type: string, description: "A security's code, from the exchanges' lists (ADR 0017)", example: "00878" }
        price:
          allOf: [{ $ref: "#/components/schemas/Price" }]
          description: "Its unit's newest price, which its worth used; absent for NT$ and for a unit without one"

    Price:
      type: object
      description: "What one unit is worth by its newest price, whatever the source (ADR 0020)"
      required: [asOf, source, quote, quoted]
      properties:
        asOf: { type: string, format: date-time, description: "When the price held: the start of a rate's day, a close's 13:30, an exchange's fetch, the owner's word" }
        source: { $ref: "#/components/schemas/PriceSource" }
        quote: { type: string, description: The unit the source priced it in, example: USDT }
        quoted: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: One unit in the quote unit }
        twd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "One unit in NT$; through the quote unit's own newest price when that is not NT$, absent when that one is not in NT$"

    PriceSource:
      type: string
      enum: [fawaz, twse, tpex, max, binance, bitget, owner]
      description: "The exchange-rate feed (ADR 0015), the stock exchanges' closes (ADR 0017), a crypto exchange's markets (ADR 0018), or the owner"

    UnitKind:
      type: string
      enum: [money, security, points]

    Unit:
      type: object
      required: [id, kind, symbol]
      properties:
        id: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/UnitKind" }
        symbol: { type: string, example: 小樹點(信用卡) }
        code: { type: string, description: "A security's code", example: "00878" }

    BalanceGap:
      type: object
      description: Two consecutive balances in one unit that the lines between them do not join
      required: [unit, from, to, unseen]
      properties:
        unit: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        unseen: { $ref: "#/components/schemas/Decimal", description: Money that moved between them that no line shows }

    GapFillCreate:
      type: object
      description: One of the account's gaps, as `gaps` lists it
      required: [unit, from, to]
      properties:
        unit: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        memo: { type: string, description: "What the owner writes about it; absent or empty keeps what the same gap's fill had" }

    GapFillUpdate:
      type: object
      required: [memo]
      properties:
        memo: { type: string, description: "Trimmed; empty clears it" }

    GapFill:
      type: object
      description: What the owner made up for a gap between two balances
      required: [id, unit, from, to, "on", amount]
      properties:
        id: { type: integer, format: int64 }
        unit: { type: string }
        from: { type: string, format: date, description: The day of the balance before }
        to: { type: string, format: date, description: The day of the balance after }
        "on": { type: string, format: date, description: The day it counts as moved, the last no report covers }
        amount: { $ref: "#/components/schemas/Decimal", description: "What moved unseen, as a line's amount would be: money in positive" }
        memo: { type: string, description: What the owner wrote about it; absent when nothing }

    AccountCreate:
      type: object
      required: [kind, name]
      properties:
        kind:
          allOf: [{ $ref: "#/components/schemas/AccountKind" }]
          description: "Any but credit_card"
        name: { type: string, description: "Its own name (`label`), no other account's", example: 飯店會員 }

    AccountCreated:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int64 }

    HoldingsUpdate:
      type: object
      required: [holdings]
      properties:
        holdings:
          type: array
          items:
            type: object
            required: [unit, amount, expiries]
            properties:
              unit: { type: string, description: "Its symbol: a currency or coin, a security's name, a points program's", example: 飯店點數 }
              amount: { $ref: "#/components/schemas/Decimal" }
              expiries:
                type: array
                items:
                  type: object
                  required: [amount, by]
                  properties:
                    amount: { $ref: "#/components/schemas/Decimal" }
                    by: { type: string, format: date }

    UnitPriceUpdate:
      type: object
      required: [value]
      properties:
        value:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "What one unit is worth in the quote unit: 0 or more"
        quote:
          type: string
          description: "A money unit to price it in, NT$ when left out; one with no price in NT$ gives it no worth"

    AccountUpdate:
      type: object
      properties:
        name: { type: string, description: "The owner's name for the account; empty clears it" }
        fullNumber: { type: string, description: "Where the source prints a masked number, its digits (spaces and dashes allowed); else any. Empty clears it" }

    LineCounterpart:
      type: object
      description: The other line of a transfer or card payment (ADR 0016)
      required: [id, date, accountKind, institution]
      properties:
        id: { type: integer, format: int64 }
        statementId: { type: integer, format: int64, description: "The statement that reports it; absent for an exchange's deposit or withdrawal (ADR 0018)" }
        date: { type: string, format: date }
        accountKind: { $ref: "#/components/schemas/AccountKind" }
        accountId: { type: integer, format: int64, description: "A deposit account; absent for a card bill" }
        institution: { type: string }
        accountName: { type: string, description: "The owner's name for the account, else the bank's" }
        accountNumber: { type: string, description: "Its full number where given, else as printed" }

    AccountLine:
      type: object
      description: |
        A line a statement reports, a deposit or withdrawal an exchange reports (ADR 0018), or the owner's
        fill of a gap (`fill`): one line for the whole period no statement covers, as a passbook prints one
        for what went unprinted, dated on its last day, with the fill's memo and the balance it leaves.
      required: [id, date, description, kind, unit, amount]
      properties:
        id: { type: integer, format: int64, description: "The line's, or the fill's for a fill" }
        statementId: { type: integer, format: int64, description: "The statement that reports it; absent for a fill and an exchange's line" }
        fill: { $ref: "#/components/schemas/LineFill" }
        date: { type: string, format: date }
        description: { type: string }
        memo: { type: string, nullable: true }
        counterparty: { type: string, nullable: true }
        kind: { type: string, description: "A card line's kind, or interest, fee, or other on a deposit account" }
        unit: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        balance: { allOf: [{ $ref: "#/components/schemas/Decimal" }], nullable: true, description: "The running balance, when printed" }
        counterpart: { $ref: "#/components/schemas/LineCounterpart" }
        trade: { $ref: "#/components/schemas/Trade" }

    LineFill:
      type: object
      description: The owner's fill of a gap, as a line
      required: [id, from, to]
      properties:
        id: { type: integer, format: int64 }
        from: { type: string, format: date, description: The day of the balance before }
        to: { type: string, format: date, description: The day of the balance after }

    Trade:
      type: object
      description: "A trade's money; its line's amount is the shares, its unit the security (ADR 0017)"
      required: [category, price, amount, fee, tax, net]
      properties:
        category: { type: string, description: "The broker's category as printed", example: 集買 }
        price: { $ref: "#/components/schemas/Decimal" }
        amount: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: "價金: the shares at the price" }
        fee: { $ref: "#/components/schemas/Decimal" }
        tax: { $ref: "#/components/schemas/Decimal" }
        net:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "應收付: received positive, paid negative; zero for a buy paid in advance"
        prepaid: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: "預繳金, for a buy paid in advance" }

    Check:
      type: object
      required: [name, unit, computed, stated, balanced]
      properties:
        name: { type: string, description: "The statement's own label for the figure, e.g. 本期新增款項" }
        unit: { type: string, description: "What both are in, as printed; empty when the statement prints none" }
        computed: { $ref: "#/components/schemas/Decimal" }
        stated: { $ref: "#/components/schemas/Decimal" }
        balanced: { type: boolean }

    TransactionSort:
      type: string
      enum: [newest, oldest, largest, smallest]
      default: newest

    TransactionKind:
      type: string
      description: A card line's kind (purchase … payment), a deposit line's (interest, fee, other; ADR 0013), a trade's (buy, sell; ADR 0017), or a points line's (earn, adjust, redeem; ADR 0019)
      enum: [purchase, foreign_transaction_fee, annual_fee, refund, rebate, payment, interest, fee, other, buy, sell, earn, adjust, redeem]

    Transaction:
      type: object
      required: [id, statementId, institution, transactionDate, description, kind, amount, flow, unit, accountKind]
      properties:
        id: { type: integer, format: int64 }
        statementId: { type: integer, format: int64 }
        institution: { type: string }
        transactionDate: { type: string, format: date }
        postingDate: { type: string, format: date }
        description: { type: string }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        amount: { $ref: "#/components/schemas/Decimal" }
        originalAmount: { $ref: "#/components/schemas/Decimal" }
        originalCurrency: { type: string }
        country: { type: string }
        cardLast4: { type: string }
        accountKind: { $ref: "#/components/schemas/AccountKind" }
        accountId: { type: integer, format: int64, description: "A deposit account; absent for a card line" }
        accountName: { type: string, description: "The owner's name for a deposit account, else the bank's" }
        accountNumber: { type: string, description: "A deposit account's full number where given, else as printed" }
        unit: { type: string, description: "ISO 4217, or a points program's code" }
        memo: { type: string }
        counterparty: { type: string }
        balance: { $ref: "#/components/schemas/Decimal" }
        flow:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "Seen from the owner: money out negative, a card line's sign turned (ADR 0013); in search, net of the children folded into it"
        counterpart: { $ref: "#/components/schemas/LineCounterpart" }
        trade: { $ref: "#/components/schemas/Trade" }
        parent:
          $ref: "#/components/schemas/TransactionLink"
          description: The line this one adjusts, such as the purchase a fee or refund belongs to
        children:
          type: array
          description: Lines that adjust this one, possibly on other statements; absent without any
          items: { $ref: "#/components/schemas/TransactionLink" }

    TransactionLink:
      description: Another line, in short, enough to find it and to tell a refund in full
      type: object
      required: [id, statementId, kind, transactionDate, amount]
      properties:
        id: { type: integer, format: int64 }
        statementId: { type: integer, format: int64 }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        transactionDate: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Decimal" }
        originalAmount: { $ref: "#/components/schemas/Decimal" }
        originalCurrency: { type: string }

    TransactionFamily:
      type: object
      required: [transaction, children]
      properties:
        transaction: { $ref: "#/components/schemas/Transaction" }
        parent: { $ref: "#/components/schemas/Transaction" }
        children:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }

    TransactionSearch:
      type: object
      required: [items, total, sum, flows, byKind, byCard, byAccount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        total: { type: integer, description: Rows matching every filter }
        sum:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "Amounts as printed, which only adds up within one kind of account: use with accountKind"
        flows:
          type: array
          description: "Per unit, what went out and came in, seen from the owner; transfers and card payments are neither (ADR 0016)"
          items: { $ref: "#/components/schemas/UnitFlow" }
        byKind:
          type: array
          items: { $ref: "#/components/schemas/KindTotal" }
        byCard:
          type: array
          items: { $ref: "#/components/schemas/CardTotal" }
        byAccount:
          type: array
          description: Deposit accounts, a facet like byCard
          items: { $ref: "#/components/schemas/AccountTotal" }

    UnitFlow:
      type: object
      required: [unit, spent, received, moved, movedCount]
      properties:
        unit: { type: string }
        spent: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: "Negative or zero" }
        received: { $ref: "#/components/schemas/Decimal" }
        moved:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: "What moved between the owner's own lines (transfers, card payments), each link once: neither spent nor received"
        movedCount: { type: integer, description: "Rows listed for it" }

    AccountTotal:
      type: object
      required: [accountId, institution, count]
      properties:
        accountId: { type: integer, format: int64 }
        institution: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        count: { type: integer }

    KindTotal:
      type: object
      required: [kind, count, amount, flow]
      properties:
        kind: { $ref: "#/components/schemas/TransactionKind" }
        count: { type: integer }
        amount: { $ref: "#/components/schemas/Decimal" }
        flow: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: Seen from the owner }

    CardTotal:
      type: object
      required: [institution, count, amount]
      properties:
        institution: { type: string }
        cardLast4: { type: string, description: Absent for rows not tied to a card, such as payments }
        count: { type: integer }
        amount: { $ref: "#/components/schemas/Decimal" }

    NetWorth:
      type: object
      required: ["on", assets, liabilities, net, byKind, unvalued, behind]
      properties:
        "on": { type: string, format: date }
        assets: { $ref: "#/components/schemas/Decimal" }
        liabilities: { allOf: [{ $ref: "#/components/schemas/Decimal" }], description: "Negative" }
        net: { $ref: "#/components/schemas/Decimal" }
        byKind:
          type: array
          items: { $ref: "#/components/schemas/KindWorth" }
        unvalued: { type: integer, description: "Accounts without a worth on the day, left out" }
        completeAsOf: { type: string, format: date, description: "The newest day every account had reported by; absent when none has" }
        behind:
          type: array
          description: Accounts whose newest report is older than the day
          items: { type: integer, format: int64 }

    HistoryStep:
      type: string
      enum: [day, month]
      default: month
      description: Every day, or the last day of each month

    NetWorthPoint:
      type: object
      required: ["on", assets, liabilities, net, unvalued, complete]
      properties:
        "on": { type: string, format: date }
        assets: { $ref: "#/components/schemas/Decimal" }
        liabilities: { $ref: "#/components/schemas/Decimal" }
        net: { $ref: "#/components/schemas/Decimal" }
        unvalued: { type: integer }
        complete: { type: boolean, description: "Every account had reported by the day: the figure is exact" }

    KindWorth:
      type: object
      required: [kind, worth, unvalued]
      properties:
        kind: { $ref: "#/components/schemas/AccountKind" }
        worth: { $ref: "#/components/schemas/Decimal" }
        unvalued: { type: integer, description: "Accounts of the kind without a worth, left out of it" }

    Settings:
      type: object
      required: [maxUploadBytes, sourceIntervalHours, baseCurrency]
      properties:
        maxUploadBytes: { type: integer, format: int64, description: The largest file an upload may be (BACKEND_MAX_UPLOAD_MB) }
        sourceIntervalHours: { type: integer, description: "How often rates, closes, and exchanges are read" }
