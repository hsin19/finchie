syntax = "proto3";

package finchie.parser.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "google/type/decimal.proto";

// Turns a raw financial document into structured data, and opens one for a
// person to read. Stateless: the caller owns storage, retries, and
// deduplication (ADR 0002, ADR 0005).
service ParserService {
  // Status codes carry the retry decision:
  //   UNIMPLEMENTED       no parser recognizes the document (do not retry)
  //   INVALID_ARGUMENT    the file is unreadable (do not retry)
  //   FAILED_PRECONDITION the PDF password is missing or wrong (do not retry)
  //   INTERNAL            a known statement no longer matches its parser (do not retry)
  //   UNAVAILABLE, DEADLINE_EXCEEDED, RESOURCE_EXHAUSTED
  //                       transient (retry)
  // An unbalanced statement is still OK; see Reconciliation.
  rpc ParseDocument(ParseDocumentRequest) returns (ParseDocumentResponse);

  // Opens a document for a person to read: an e-mail's headers, body, and
  // attachments. A PDF comes back decrypted when it opens without a password
  // or with a configured one, so the reader never needs the password
  // (ADR 0012).
  //   INVALID_ARGUMENT    the file is no e-mail (a bare PDF included: ADR 0014),
  //                       or is unreadable
  rpc OpenDocument(OpenDocumentRequest) returns (OpenDocumentResponse);

  // What the parser can parse now, so the caller can tell which documents to
  // parse again: one an older version of its parser read, and one that failed
  // under an earlier instance, whose configuration may have changed since.
  rpc DescribeParsers(DescribeParsersRequest) returns (DescribeParsersResponse);
}

message DescribeParsersRequest {}

message DescribeParsersResponse {
  repeated ParserVersion parsers = 1;
  // Changes every time the parser starts. Passwords, the owner's details, and
  // OCR are set when it starts, so a document that failed for want of one may
  // parse under a new instance; never anything derived from them.
  string instance = 2;
}

message ParserVersion {
  // As in ParseDocumentResponse.parser, e.g. "taishin.credit_card".
  string name = 1;
  // As in ParseDocumentResponse.parser_version.
  string version = 2;
}

message ParseDocumentRequest {
  // The caller's document ID, echoed in logs and traces on both sides.
  string document_id = 1;
  // For logs only: the parser reads the document from its bytes.
  string filename = 2;
  // Always "message/rfc822": every document is an e-mail (ADR 0014). For logs
  // only, like filename.
  string content_type = 3;
  bytes content = 4;
}

message OpenDocumentRequest {
  // The caller's document ID, echoed in logs and traces on both sides.
  string document_id = 1;
  // As in ParseDocumentRequest.
  string filename = 2;
  // As in ParseDocumentRequest.
  string content_type = 3;
  bytes content = 4;
}

message OpenDocumentResponse {
  Email email = 1;
  // The e-mail's attachments in order.
  repeated File files = 2;
}

message Email {
  // Header values with encoded words decoded, e.g. "國泰世華銀行 <bank@example.com>".
  string sender = 1;
  string recipient = 2;
  string subject = 3;
  // Unset when the message has no readable Date header.
  google.protobuf.Timestamp date = 4;
  // The body to show, HTML when the message has it, else plain text; at most
  // one is set. Images the HTML references by Content-ID are embedded as data:
  // URIs, so it needs nothing else to display.
  string html = 5;
  string text = 6;
}

message File {
  string filename = 1;
  // "application/pdf" when the bytes are a PDF, else as the e-mail declares it.
  string content_type = 2;
  bytes content = 3;
  // A PDF that none of the configured passwords opens, returned as received.
  bool locked = 4;
  // The one file that stands for the document: the PDF that parsing would
  // pick as the statement (a known name whose text carries the bank's marker,
  // else any PDF a parser recognizes by its text), else the first PDF. None
  // without a PDF.
  bool primary = 5;
}

message ParseDocumentResponse {
  // Which parser handled the document, e.g. "taishin.credit_card".
  string parser = 1;
  // Bumped whenever the parser's output for the same input can change. The
  // caller keeps it with what it stored, to tell which documents an older
  // version parsed.
  string parser_version = 2;
  // A credit card bill. Exactly one of statement, deposit_statement, and
  // securities_statement is set (ADR 0013, ADR 0017).
  Statement statement = 3;
  // Problems that did not stop parsing, e.g. OCR text that could not be read.
  repeated string warnings = 4;
  DepositStatement deposit_statement = 5;
  SecuritiesStatement securities_statement = 6;
}

// A credit card bill.
message Statement {
  // Stable institution ID: "esun", "taishin", "cathay", "hsbc".
  string institution = 1;
  google.type.Date closing_date = 2;
  google.type.Date due_date = 3;
  // ISO 4217 code of the statement, e.g. "TWD".
  string currency = 4;
  // Amount due for this statement, as printed.
  google.type.Decimal total_due = 5;
  repeated Transaction transactions = 6;
  Reconciliation reconciliation = 7;
  // The rewards programs the bill reports (ADR 0019).
  repeated PointsProgram points = 8;
}

// A rewards program on a card bill, its points a unit of their own (ADR 0019).
message PointsProgram {
  // As the bill prints it, e.g. "小樹點(信用卡)": the program's unit.
  string name = 1;
  // At the closing date. Whether opening, added, and used add up to it is the
  // parser's to check, and a warning when they do not.
  google.type.Decimal closing = 2;
  repeated PointsExpiry expiries = 3;
  // The period's movements as the bill totals them: one per column with a
  // figure. Points that lapse show in none (ADR 0019).
  repeated PointsLine lines = 4;
}

message PointsLine {
  // The bill's own label for the column, e.g. "本期兌/轉換".
  string label = 1;
  PointsLineKind kind = 2;
  // Seen from the account: points added positive, used negative.
  google.type.Decimal amount = 3;
}

enum PointsLineKind {
  POINTS_LINE_KIND_UNSPECIFIED = 0;
  // Earned, a bonus included.
  POINTS_LINE_KIND_EARN = 1;
  // An adjustment, either way.
  POINTS_LINE_KIND_ADJUST = 2;
  // Used or redeemed.
  POINTS_LINE_KIND_REDEEM = 3;
}

// Points the bill says will lapse by a date, as printed: one date's, one
// month's (by its last day), or several months' together.
message PointsExpiry {
  google.type.Decimal amount = 1;
  google.type.Date by = 2;
}

// Amounts follow the statement's sign: charges positive, credits negative
// (ADR 0004).
message Transaction {
  google.type.Date transaction_date = 1;
  // Unset when the statement does not print a posting date.
  google.type.Date posting_date = 2;
  string description = 3;
  TransactionKind kind = 4;
  // In the statement's currency.
  google.type.Decimal amount = 5;
  // Set for foreign transactions: the amount and ISO 4217 currency as charged.
  google.type.Decimal original_amount = 6;
  string original_currency = 7;
  // ISO 3166-1 alpha-2 country of the merchant, when printed.
  string country = 8;
  // Last four digits of the card, when the statement lists several cards.
  string card_last4 = 9;
}

enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_PURCHASE = 1;
  TRANSACTION_KIND_FOREIGN_TRANSACTION_FEE = 2;
  // Annual fees and their waivers (negative).
  TRANSACTION_KIND_ANNUAL_FEE = 3;
  TRANSACTION_KIND_REFUND = 4;
  // Cash back and points redeemed against the bill.
  TRANSACTION_KIND_REBATE = 5;
  TRANSACTION_KIND_PAYMENT = 6;
}

// Each bank parser picks which lines make up the statement's new charges and
// which printed amount they must add up to.
message Reconciliation {
  bool balanced = 1;
  google.type.Decimal computed = 2;
  google.type.Decimal stated = 3;
  // The statement's own label for `stated`, e.g. "本期新增款項".
  string stated_label = 4;
}

// A deposit statement: the balances and lines of every account one statement
// covers, a combined statement (綜合對帳單) several (ADR 0013).
message DepositStatement {
  // Stable institution ID, as for Statement.
  string institution = 1;
  google.type.Date period_start = 2;
  // The day its closing balances are as of.
  google.type.Date period_end = 3;
  // One per account and currency.
  repeated DepositAccount accounts = 4;
}

message DepositAccount {
  // As printed, usually masked by the bank, and normalized by the parser so
  // one account reads the same every month.
  string number = 1;
  // The bank's name for it, e.g. "臺幣活存".
  string name = 2;
  // ISO 4217 code of this part of the account.
  string currency = 3;
  // Unset when the statement does not print one.
  google.type.Decimal opening_balance = 4;
  google.type.Decimal closing_balance = 5;
  repeated DepositLine lines = 6;
  // Whether the lines account for the closing balance: from the opening
  // balance, and through each printed running balance. Unset when there is
  // nothing to add up.
  Reconciliation reconciliation = 7;
}

// Seen from the account: money in is positive (ADR 0013).
message DepositLine {
  google.type.Date date = 1;
  // The bank's summary of the line, e.g. "ＡＴＭ跨行轉".
  string description = 2;
  // The bank's note on it, e.g. who a transfer came from.
  string memo = 3;
  // The other side's bank and account, when printed.
  string counterparty = 4;
  google.type.Decimal amount = 5;
  // The running balance after the line, when printed.
  google.type.Decimal balance = 6;
  DepositLineKind kind = 7;
}

// Only what the bank's own wording says; card payments and transfers between
// the owner's accounts are worked out by the backend.
enum DepositLineKind {
  DEPOSIT_LINE_KIND_UNSPECIFIED = 0;
  DEPOSIT_LINE_KIND_OTHER = 1;
  DEPOSIT_LINE_KIND_INTEREST = 2;
  DEPOSIT_LINE_KIND_FEE = 3;
}

// A brokerage account's monthly statement: the month's trades and the holdings
// at its end (ADR 0017).
message SecuritiesStatement {
  // Stable institution ID, as for Statement, e.g. "skis".
  string institution = 1;
  // As printed, masked by the broker.
  string account_number = 2;
  google.type.Date period_start = 3;
  google.type.Date period_end = 4;
  // The day the holdings are as of.
  google.type.Date holdings_date = 5;
  // The whole account on holdings_date: a security not listed holds nothing.
  repeated SecuritiesHolding holdings = 6;
  repeated SecuritiesTrade trades = 7;
  // Whether the trades add up to the totals the statement prints.
  Reconciliation reconciliation = 8;
}

message SecuritiesHolding {
  // The security's name as printed, Unicode-normalized, e.g. "台積電".
  string name = 1;
  // Ordinary shares (普通).
  google.type.Decimal shares = 2;
}

message SecuritiesTrade {
  google.type.Date date = 1;
  // As for SecuritiesHolding.
  string name = 2;
  TradeSide side = 3;
  // Shares traded, positive.
  google.type.Decimal shares = 4;
  google.type.Decimal price = 5;
  // The broker's category as printed, e.g. "集買".
  string category = 6;
  // 價金: the shares at the price.
  google.type.Decimal amount = 7;
  google.type.Decimal fee = 8;
  google.type.Decimal tax = 9;
  // 應收付: what the owner receives (positive) or pays (negative); zero for a
  // buy paid in advance.
  google.type.Decimal net = 10;
  // 預繳金, unset unless the buy was paid in advance.
  google.type.Decimal prepaid = 11;
}

enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}
