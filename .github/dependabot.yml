version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/apps/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # The generated gRPC code checks these at import time; move them together.
      grpc:
        patterns:
          - "grpcio*"
          - "protobuf"
          - "googleapis-common-protos"
      ocr:
        patterns:
          - "rapidocr"
          - "onnxruntime"
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directories:
      - "/apps/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      grpc:
        patterns:
          - "google.golang.org/*"
      river:
        patterns:
          - "github.com/riverqueue/*"
      testcontainers:
        patterns:
          - "github.com/testcontainers/*"
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/mailbox"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # typescript-eslint needs TypeScript 6 (peer <6.1.0; TypeScript 7 has no compiler API before 7.1). In
      # the one group below, a TypeScript 7 bump would fail lint and hold every other mailbox update back.
      # Lift once typescript-eslint supports TypeScript 7 (typescript-eslint#10940).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Deployed by hand (ADR 0010): a merged bump reaches Cloudflare at the next `task mailbox:deploy`.
      mailbox:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # @types/node follows the Node major in apps/web/.node-version (an LTS line).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Its output is committed (apps/web/src/lib/api/schema.d.ts), so a bump can need `task web:generate`.
      codegen-manual:
        patterns:
          - "openapi-typescript"
      svelte:
        patterns:
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
      non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # check.yml does not build images, so a green PR says nothing about a new base image; release.yml
  # is the first to build and smoke-check it. Left for a human.
  - package-ecosystem: "docker"
    directories:
      - "/apps/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      images-manual:
        patterns:
          - "*"
    ignore:
      # A new Python moves the parser's image and its .python-version, which the tests run on, together
      # and by hand. Dependabot would bump the image alone, before the wheels exist: onnxruntime had none
      # for Python 3.15 when it proposed it.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      compose-manual:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
